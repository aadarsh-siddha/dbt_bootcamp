version: 2
sources:
  - name: stripe
    database: raw
    schema: stripe
    tables:
      - name: payment
        freshness: 
          error_after:
            count: 8
            period: day
          warn_after:
            count: 4
            period: day
        loaded_at_field: _batched_at
        columns:
          - name: id
            tests:
              - unique:
                  severity: error
                  error_if: ">=100"
                  warn_if: ">=10"
          - name: paymentmethod
          - name: status
            tests:
              - accepted_values:
                  values:
                    - success
                    - fail

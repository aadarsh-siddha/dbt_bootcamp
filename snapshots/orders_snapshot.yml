snapshots:
  - name: orders_snapshots
    relation: source('jaffle_shop', 'orders')
    config:
      schema: snapshots
      database: analytics
      unique_key: order_id
      strategy: check
      check_cols: ['id','ordered_at']
      hard_deletes: ignore
      dbt_valid_to_current: "to_date('9999-12-31')"